<section>

  <h1>Administración</h1>

  <p>
    Inicia sesión para administrar la tienda.
  </p>


  <form
    (ngSubmit)="iniciarSesion()"
  >

    <div>

      <label for="usuario">
        Usuario
      </label>

      <input
        id="usuario"
        type="text"
        name="usuario"
        [(ngModel)]="usuario"
        required
      >

    </div>


    <div>

      <label for="password">
        Contraseña
      </label>

      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        required
      >

    </div>


    @if (error()) {

      <p>
        {{ error() }}
      </p>

    }


    <button
      type="submit"
      [disabled]="cargando()"
    >

      @if (cargando()) {
        Ingresando...
      } @else {
        Iniciar sesión
      }

    </button>

  </form>

</section>
