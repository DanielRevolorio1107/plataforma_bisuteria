<section class="pagina-login">

  <div class="tarjeta-login">

    <div class="marca">

      <img
        src="/logo-zas-jewel.jpeg"
        alt="ZAS Jewel"
        class="logo"
      >

      <span>
        ZAS JEWEL
      </span>

    </div>


    <div class="encabezado">

      <span>
        Administración
      </span>

      <h1>
        Panel Administrativo
      </h1>

      <p>
        Ingresa tus credenciales para continuar.
      </p>

    </div>


    <form
      (ngSubmit)="iniciarSesion()"
      class="formulario"
    >

      <div class="campo">

        <label for="usuario">
          Usuario
        </label>

        <input
          id="usuario"
          type="text"
          name="usuario"
          [(ngModel)]="usuario"
          placeholder="Ingresa tu usuario"
          autocomplete="username"
          required
        >

      </div>


      <div class="campo">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          required
        >

      </div>


      @if (error()) {

        <p class="error">
          {{ error() }}
        </p>

      }


      <button
        type="submit"
        class="boton-ingresar"
        [disabled]="cargando()"
      >

        @if (cargando()) {
          Ingresando...
        } @else {
          Iniciar sesión
        }

      </button>

    </form>


    <a
      routerLink="/"
      class="volver"
    >
      ← Volver a la tienda
    </a>

  </div>

</section>
