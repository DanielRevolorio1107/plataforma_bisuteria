<section>

  <div class="encabezado">

    <h1>Nueva categoría</h1>

    <a routerLink="/admin/categorias">
      Volver
    </a>

  </div>


  <form
    (ngSubmit)="guardarCategoria()"
  >

    <div>

      <label for="nombre">
        Nombre
      </label>

      <input
        id="nombre"
        type="text"
        name="nombre"
        [(ngModel)]="nombre"
        required
      >

    </div>


    <div>

      <label for="descripcion">
        Descripción
      </label>

      <textarea
        id="descripcion"
        name="descripcion"
        [(ngModel)]="descripcion"
      ></textarea>

    </div>


    @if (error()) {

      <p>
        {{ error() }}
      </p>

    }


    <button
      type="submit"
      [disabled]="guardando()"
    >

      @if (guardando()) {
        Guardando...
      } @else {
        Guardar categoría
      }

    </button>

  </form>

</section>
